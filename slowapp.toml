# The example slowapp: the moon's phase for the middle third. No network, no secrets, no data:
# everything is computed from the time, so fixture mode needs nothing but `now`.
[app]
id = "moon"
title = "Moon"
contract = 4
image = "ghcr.io/mike-anderson/slowapp-example"
memory = "48m"
tmp = "8m"
timeout_s = 30
network = "none"
# The catalog page's words (slowboard.io and a hub's Apps pages). Add `license` (an SPDX
# expression) once the repo has one; until then validate warns that the page shows a blank.
blurb = "The moon's phase, and when the next full and new moons are."
about = "Today's moon as it looks from your hemisphere, how much of it is lit, and the dates of the next full and new moons, with the week ahead on a second card."
ink = "yellow"
repo = "https://github.com/mike-anderson/slowapp-example"

[settings]
south = { type = "boolean", default = false, label = "Southern hemisphere (the lit side flips)" }

[[job]]
name = "render"
expected_s = 3

[[feed]]
name = "phase"
size = "slot"

[[example]]
name = "today"
caption = "7 Oct 2026: a waning crescent, new moon on the 10th"
fixture = "fixtures/default"
now = "2026-10-07T09:00:00-07:00"
feeds = { phase = "456x444.k4" }

[[example]]
name = "south"
caption = "The same moon from the southern hemisphere"
fixture = "fixtures/default"
now = "2026-10-07T09:00:00-07:00"
settings = { south = true }
feeds = { phase = "456x444.k4" }
